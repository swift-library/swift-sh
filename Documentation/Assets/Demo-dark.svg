  <g font-family="ui-monospace, monospace" font-size="14">
    <text x="280.5" y="22" text-anchor="middle" fill="#8b949e">swift-sh · inline package dependencies</text>
    <text x="20" y="68" fill="#c9d1d9" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">cat version.swift</tspan></text>
    <text x="20" y="89" fill="#c9d1d9" xml:space="preserve">#!/usr/bin/swift sh</text>
    <text x="20" y="110" fill="#c9d1d9" xml:space="preserve">import SemVer  // swift-library/swift-semver == 0.1.1</text>
    <text x="20" y="131" fill="#c9d1d9" xml:space="preserve"></text>
    <text x="20" y="152" fill="#c9d1d9" xml:space="preserve">let version = try Version(parsing: CommandLine.arguments[1])</text>
    <text x="20" y="173" fill="#c9d1d9" xml:space="preserve">print(try version.incrementing(.minor))</text>
    <text x="20" y="194" fill="#c9d1d9" xml:space="preserve"></text>
    <text x="20" y="215" fill="#c9d1d9" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">swift sh version.swift 1.2.3</tspan></text>
