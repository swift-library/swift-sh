<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 467" width="554" height="467" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><rect x="0.5" y="0.5" width="553" height="466" rx="10" fill="#0d1117" stroke="#30363d"/><path d="M0.5 34 V10.5 a10 10 0 0 1 10 -10 H543 a10 10 0 0 1 10 10 V34 Z" fill="#161b22"/><line x1="0.5" y1="34" x2="553" y2="34" stroke="#30363d"/><circle cx="20" cy="17.0" r="6" fill="#ff5f57"/><circle cx="40" cy="17.0" r="6" fill="#febc2e"/><circle cx="60" cy="17.0" r="6" fill="#28c840"/><text x="20" y="64" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> cat greet.swift</tspan></text><text x="20" y="85" fill="#c9d1d9" xml:space="preserve">#!/usr/bin/swift sh</text><text x="20" y="106" fill="#c9d1d9" xml:space="preserve">import ArgumentParser  // apple/swift-argument-parser ~&gt; 1.8</text><text x="20" y="127" fill="#c9d1d9" xml:space="preserve"></text><text x="20" y="148" fill="#c9d1d9" xml:space="preserve">@main</text><text x="20" y="169" fill="#c9d1d9" xml:space="preserve">struct Greet: ParsableCommand {</text><text x="20" y="190" fill="#c9d1d9" xml:space="preserve">  @Argument var name: String</text><text x="20" y="211" fill="#c9d1d9" xml:space="preserve">  @Option var count = 1</text><text x="20" y="232" fill="#c9d1d9" xml:space="preserve"></text><text x="20" y="253" fill="#c9d1d9" xml:space="preserve">  func run() {</text><text x="20" y="274" fill="#c9d1d9" xml:space="preserve">    for _ in 0..&lt;count {</text><text x="20" y="295" fill="#c9d1d9" xml:space="preserve">      print(&quot;Hello, \(name)!&quot;)</text><text x="20" y="316" fill="#c9d1d9" xml:space="preserve">    }</text><text x="20" y="337" fill="#c9d1d9" xml:space="preserve">  }</text><text x="20" y="358" fill="#c9d1d9" xml:space="preserve">}</text><text x="20" y="379" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> chmod +x greet.swift</tspan></text><text x="20" y="400" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> ./greet.swift Swift --count 2</tspan></text><text x="20" y="421" fill="#c9d1d9" xml:space="preserve">Hello, Swift!</text><text x="20" y="442" fill="#c9d1d9" xml:space="preserve">Hello, Swift!</text></svg>