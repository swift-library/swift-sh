name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing accepted version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@ad683fc5f2aea7f9b78e0cc4a8e88895e72fadec
    with:
      ref: ${{ inputs.tag }}
  publish:
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: swift-library/.github/.github/workflows/swift-package-release.yml@ad683fc5f2aea7f9b78e0cc4a8e88895e72fadec
    with:
      tag: ${{ inputs.tag }}
      accepted_commit: ${{ needs.validate.outputs.commit }}
